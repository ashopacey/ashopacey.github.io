<body class="antialiased selection:bg-brand selection:text-white">
    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none transition-opacity duration-500 dark:opacity-30">

    <script type="text/babel">
        const { useState, useEffect } = React;
        const translations = {
            EN: { navFeatures: "Features", navContact: "Contact", navGuides: "Guides", navAbout: "About", buyNow: "Buy Now", rights: "AShop. All rights reserved.", tos: "Terms of Service", policy: "Privacy Policy", joinComm: "Join our community", notAffil: "Not affiliated with Roblox Corporation. All trademarks belong to their respective owners.", backHome: "Back to Home", lastUpdated: "Last updated:", readPolicy: "Read the Privacy Policy", readTos: "Read the Terms of Service", aboutTitle: "About AShop", aboutDesc: "Welcome to AShop! We are dedicated to providing the Myanmar community with the cheapest and fastest Robux services. Our goal is to make purchasing digital goods accessible, easy, and completely secure using local payment methods you already trust.", ourPolicy: "Our Policy", policyDesc: "Customer satisfaction is our top priority. We guarantee delivery on all valid orders and ensure transparent communication throughout the process.", workingHours: "Working Hours", hoursDesc: "We aim to fulfill orders as fast as possible. Drop us a message on Telegram, and we will assist you right away.", explore: "Explore", preferences: "Preferences", mobFeatures: "Features", mobFeaturesDesc: "what we offer", mobContactTab: "Contact", mobContactDesc: "check our social media accounts", mobGuides: "How to buy", mobGuidesDesc: "guides and faq", mobAbout: "About AShop", mobAboutDesc: "learn more about ashop" },
            MM: { navFeatures: "Features", navContact: "Contact", navGuides: "Guides", navAbout: "About", buyNow: "Buy Now", rights: "AShop. All rights reserved.", tos: "Terms of Service", policy: "Privacy Policy", joinComm: "Join our community", notAffil: "Not affiliated with Roblox Corporation. All trademarks belong to their respective owners.", backHome: "Back to Home", lastUpdated: "Last updated:", readPolicy: "Read the Privacy Policy", readTos: "Read the Terms of Service", aboutTitle: "About AShop", aboutDesc: "Welcome to AShop! We are dedicated to providing the Myanmar community with the cheapest and fastest Robux services. Our goal is to make purchasing digital goods accessible, easy, and completely secure using local payment methods you already trust.", ourPolicy: "Our Policy", policyDesc: "Customer satisfaction is our top priority. We guarantee delivery on all valid orders and ensure transparent communication throughout the process.", workingHours: "Working Hours", hoursDesc: "We aim to fulfill orders as fast as possible. Drop us a message on Telegram, and we will assist you right away.", explore: "Explore", preferences: "Preferences", mobFeatures: "Features", mobFeaturesDesc: "what we offer", mobContactTab: "Contact", mobContactDesc: "check our social media accounts", mobGuides: "How to buy", mobGuidesDesc: "guides and faq", mobAbout: "About AShop", mobAboutDesc: "learn more about ashop" }
        };

        const Navbar = ({ lang, setLang, darkMode, setDarkMode, activeSection }) => {
            const [isScrolled, setIsScrolled] = useState(false);
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
            const t = translations[lang];
            useEffect(() => { const handleScroll = () => setIsScrolled(window.scrollY > 20); window.addEventListener('scroll', handleScroll); return () => window.removeEventListener('scroll', handleScroll); }, []);
            useEffect(() => { if (mobileMenuOpen) document.body.style.overflow = 'hidden'; else document.body.style.overflow = ''; return () => { document.body.style.overflow = ''; } }, [mobileMenuOpen]);
            const navLinks = [ { name: t.navFeatures, href: '/#features', id: 'features' }, { name: t.navContact, href: '/#contact', id: 'contact' }, { name: t.navGuides, href: '/guides', id: 'guides' }, { name: t.navAbout, href: '/about', id: 'about' } ];
            const handleNavClick = (e, href) => {
                const isIndex = window.location.pathname.endsWith('/') || window.location.pathname === '/' || window.location.pathname.endsWith('/');
                if (href.startsWith('/#')) {
                    if (isIndex) {
                        e.preventDefault();
                        const targetId = href.split('#')[1];
                        const el = document.getElementById(targetId);
                        if (el) {
                            const rect = el.getBoundingClientRect();
                            if (Math.abs(rect.top) < 150) { window.scrollBy({ top: -10, behavior: 'smooth' }); setTimeout(() => el.scrollIntoView({ behavior: 'smooth' }), 150); }

                        setMobileMenuOpen(false);
                    }

            return (

                        </div>
                        <div className="flex items-center gap-2 md:gap-4 relative z-[80]">
                            <div className="hidden md:flex items-center ui-box p-1 rounded-full shadow-sm">
                                <button onClick={() => setDarkMode(false)} className={`w-8 h-8 rounded-full flex items-center justify-center transition-all ${!darkMode ? 'bg-white dark:bg-slate-800 text-brand shadow-sm' : 'text-slate-400 dark:text-slate-500 hover:text-slate-600'}`}><i className="fa-solid fa-sun text-sm"></i></button>
                                <button onClick={() => setDarkMode(true)} className={`w-8 h-8 rounded-full flex items-center justify-center transition-all ${darkMode ? 'bg-white dark:bg-slate-800 text-brand shadow-sm' : 'text-slate-400 dark:text-slate-500 hover:text-slate-600'}`}><i className="fa-solid fa-moon text-sm"></i></button>
                            </div>
                            <div className="flex items-center gap-1.5 text-xs md:text-sm font-bold ui-box px-2 md:px-3 py-1.5 rounded-full shadow-sm">
                                <button onClick={() => setLang('EN')} className={`transition-colors ${lang === 'EN' ? 'text-brand' : 'text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300'}`}>EN</button>
                                <span className="text-slate-300 dark:text-slate-700">/</span>
                                <button onClick={() => setLang('MM')} className={`transition-colors ${lang === 'MM' ? 'text-brand' : 'text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300'}`}>မြန်မာ</button>
                            </div>
                            <a href="https://t.me/ashopacey" target="_blank" className="bg-brand text-white px-4 md:px-6 py-2 md:py-2.5 rounded-full font-bold hover:bg-brand-dark transition-all duration-300 shadow-lg shadow-brand/30 transform hover:-translate-y-0.5 text-sm md:text-base">{t.buyNow}</a>
                            <button className="md:hidden text-2xl text-slate-600 dark:text-slate-300 hover:text-brand transition-colors pl-2 relative z-[90]" onClick={() => setMobileMenuOpen(true)}><i className="fa-solid fa-bars"></i></button>
                        </div>
                    </div>
                    {mobileMenuOpen && (
                        <div className="md:hidden fixed inset-0 z-[100] bg-white/95 dark:bg-slate-950/95 backdrop-blur-2xl flex flex-col h-[100dvh] w-full overflow-hidden animate-menu-pop">

                                <a href="/" className="flex items-center gap-3">
                                    <img src="./ashoplogo_20260806_144414_0000.png" alt="AShop Logo" onError={(e) => { e.target.onerror = null; e.target.src = "https://placehold.co/40x40/e0f2fe/0ea5e9?text=A"; }} className="w-10 h-10 rounded-xl object-cover border-2 border-slate-200 dark:border-slate-800 shadow-sm" />

                                </a>
                                <button onClick={() => setMobileMenuOpen(false)} className="w-10 h-10 rounded-full ui-box flex items-center justify-center text-xl text-slate-600 dark:text-slate-300 hover:text-brand transition-colors"><i className="fa-solid fa-xmark"></i></button>

                            <div className="p-6 flex-1 overflow-y-auto">
                                <p className="text-xs font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-6">{t.explore}</p>
                                <div className="flex flex-col gap-4">
                                    <a href="/#features" onClick={(e) => handleNavClick(e, '/#features')} className="flex items-center gap-4 p-4 rounded-3xl ui-box active:scale-95 transition-transform"><div className="w-12 h-12 rounded-2xl bg-sky-100 dark:bg-slate-800 flex items-center justify-center text-brand text-xl shadow-inner"><i className="fa-solid fa-star"></i></div><div><h4 className="text-lg font-black text-slate-900 dark:text-white">{t.mobFeatures}</h4><p className="text-xs font-bold text-slate-500">{t.mobFeaturesDesc}</p></div></a>
                                    <a href="/#contact" onClick={(e) => handleNavClick(e, '/#contact')} className="flex items-center gap-4 p-4 rounded-3xl ui-box active:scale-95 transition-transform"><div className="w-12 h-12 rounded-2xl bg-sky-100 dark:bg-slate-800 flex items-center justify-center text-brand text-xl shadow-inner"><i className="fa-solid fa-comment-dots"></i></div><div><h4 className="text-lg font-black text-slate-900 dark:text-white">{t.mobContactTab}</h4><p className="text-xs font-bold text-slate-500">{t.mobContactDesc}</p></div></a>

                            </div>

                                <span className="font-bold text-slate-700 dark:text-slate-300">{t.preferences}</span>
                                <div className="flex items-center gap-1 ui-box p-1.5 rounded-2xl shadow-sm">
                                    <button onClick={() => setDarkMode(false)} className={`w-10 h-10 rounded-xl flex items-center justify-center transition-all ${!darkMode ? 'bg-white dark:bg-slate-800 text-brand shadow-md' : 'text-slate-400 dark:text-slate-500'}`}><i className="fa-solid fa-sun text-lg"></i></button>
                                    <button onClick={() => setDarkMode(true)} className={`w-10 h-10 rounded-xl flex items-center justify-center transition-all ${darkMode ? 'bg-white dark:bg-slate-800 text-brand shadow-md' : 'text-slate-400 dark:text-slate-500'}`}><i className="fa-solid fa-moon text-lg"></i></button>
                                </div>
                            </div>
                        </div>
                    )}

            );
        };

        const About = ({ lang }) => {
            const t = translations[lang];
            return (
                <section className="pt-32 pb-20 max-w-4xl mx-auto px-6 min-h-[85vh]">

                        <div className="w-20 h-20 mx-auto rounded-3xl ui-box flex items-center justify-center text-brand text-4xl mb-6 shadow-xl shadow-sky-200/50 dark:shadow-none"><i className="fa-solid fa-store"></i></div>

                        <p className="text-slate-600 dark:text-slate-400 text-lg md:text-xl font-medium leading-relaxed max-w-2xl mx-auto">{t.aboutDesc}</p>
                    </div>
                    <div className="grid sm:grid-cols-2 gap-8 mt-16">
                        <div className="p-8 glass-panel glass-panel-hover rounded-3xl text-center">
                            <i className="fa-solid fa-handshake text-brand text-4xl mb-5"></i>
                            <h3 className="text-slate-900 dark:text-slate-200 text-xl font-black mb-3">{t.ourPolicy}</h3>

                        </div>
                    </div>
                </section>
            );
        };

        const Footer = ({ lang }) => {
            const t = translations[lang];
            return (
                <footer className="pt-10 pb-6 bg-sky-100/60 dark:bg-slate-900/60 backdrop-blur-xl border-t border-sky-200 dark:border-slate-800 mt-auto shadow-[0_-10px_40px_rgba(14,165,233,0.05)]">
                    <div className="max-w-7xl mx-auto px-6">
                        <div className="flex flex-col md:flex-row justify-between items-center gap-8 mb-8">
                            <div className="flex items-center gap-3">
                                <img src="./ashoplogo_20260806_144414_0000.png" alt="Logo" className="w-8 h-8 rounded-lg shadow-sm border border-white dark:border-slate-700" onError={(e) => { e.target.style.display='none' }} />

                                <a href="/policy" className="px-5 py-3 rounded-2xl ui-box hover:border-brand hover:text-brand transition shadow-sm flex items-center justify-center gap-3"><i className="fa-solid fa-shield-halved text-brand text-lg"></i> {t.policy}</a>
                            </div>
                            <div className="flex flex-col items-center md:items-end gap-3 mt-4 md:mt-0">
                                <span className="text-[10px] font-black text-slate-500 dark:text-slate-400 uppercase tracking-widest">{t.joinComm}</span>
                                <div className="flex gap-2.5">
                                    <a href="https://www.facebook.com/share/1RrZdwAgap/" target="_blank" className="w-9 h-9 flex items-center justify-center rounded-xl bg-white dark:bg-slate-800 border border-sky-100 dark:border-slate-700 text-slate-500 hover:text-[#1877F2] hover:border-[#1877F2]/30 hover:shadow-md transition"><i className="fa-brands fa-facebook"></i></a>
                                    <a href="https://www.tiktok.com/@ashopacey" target="_blank" className="w-9 h-9 flex items-center justify-center rounded-xl bg-white dark:bg-slate-800 border border-sky-100 dark:border-slate-700 text-slate-500 hover:text-[#ff0050] hover:border-[#ff0050]/30 hover:shadow-md transition"><i className="fa-brands fa-tiktok"></i></a>
                                    <a href="https://www.youtube.com/@ashopacey" target="_blank" className="w-9 h-9 flex items-center justify-center rounded-xl bg-white dark:bg-slate-800 border border-sky-100 dark:border-slate-700 text-slate-500 hover:text-[#FF0000] hover:border-[#FF0000]/30 hover:shadow-md transition"><i className="fa-brands fa-youtube"></i></a>
                                    <a href="https://discord.gg/69dMVE8qj5" target="_blank" className="w-9 h-9 flex items-center justify-center rounded-xl bg-white dark:bg-slate-800 border border-sky-100 dark:border-slate-700 text-slate-500 hover:text-[#5865F2] hover:border-[#5865F2]/30 hover:shadow-md transition"><i className="fa-brands fa-discord"></i></a>
                                    <a href="https://t.me/ashopacey" target="_blank" className="w-9 h-9 flex items-center justify-center rounded-xl bg-white dark:bg-slate-800 border border-sky-100 dark:border-slate-700 text-slate-500 hover:text-[#229ED9] hover:border-[#229ED9]/30 hover:shadow-md transition"><i className="fa-brands fa-telegram"></i></a>
                                </div>
                            </div>
                        </div>
                        <div className="text-center border-t border-sky-200/60 dark:border-slate-800 pt-6">
                            <p className="text-[10px] text-slate-500 dark:text-slate-500 font-semibold uppercase tracking-wider">{t.notAffil}</p>
                        </div>
                    </div>
                </footer>
            );
        };

        const App = () => {
            const [lang, setLang] = useState(() => localStorage.getItem('lang') || 'EN');
            const [darkMode, setDarkMode] = useState(() => localStorage.getItem('darkMode') === 'true');

            useEffect(() => { localStorage.setItem('lang', lang); }, [lang]);
            useEffect(() => {
                localStorage.setItem('darkMode', darkMode);
                if (darkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [darkMode]);

            useEffect(() => {
                if (window.location.hash) {
                    setTimeout(() => {
                        const targetId = window.location.hash.substring(1);
                        const el = document.getElementById(targetId);
                        if (el) el.scrollIntoView({ behavior: 'smooth' });
                    }, 300);
                }
            }, []);

            return (<div className="min-h-screen flex flex-col font-sans"><Navbar lang={lang} setLang={setLang} darkMode={darkMode} setDarkMode={setDarkMode} activeSection="about" /><About lang={lang} /><Footer lang={lang} /></div>);
        };
        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>
</html>
