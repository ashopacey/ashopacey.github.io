                                    <a href="https://discord.gg/69dMVE8qj5" target="_blank" className="w-9 h-9 flex items-center justify-center rounded-xl bg-white dark:bg-slate-800 border border-sky-100 dark:border-slate-700 text-slate-500 hover:text-[#5865F2] hover:border-[#5865F2]/30 hover:shadow-md transition"><i className="fa-brands fa-discord"></i></a>
                                    <a href="https://t.me/ashopacey" target="_blank" className="w-9 h-9 flex items-center justify-center rounded-xl bg-white dark:bg-slate-800 border border-sky-100 dark:border-slate-700 text-slate-500 hover:text-[#229ED9] hover:border-[#229ED9]/30 hover:shadow-md transition"><i className="fa-brands fa-telegram"></i></a>
                                </div>
                            </div>
                        </div>
                        <div className="text-center border-t border-sky-200/60 dark:border-slate-800 pt-6">
                            <p className="text-[10px] text-slate-500 dark:text-slate-500 font-semibold uppercase tracking-wider">{t.notAffil}</p>
                        </div>
                    </div>
                </footer>
            );
        };

        const App = () => {
            const [lang, setLang] = useState(() => localStorage.getItem('lang') || 'EN');
            const [darkMode, setDarkMode] = useState(() => {
                const saved = localStorage.getItem('darkMode');
                return saved !== null ? saved === 'true' : window.matchMedia('(prefers-color-scheme: dark)').matches;
            });
            const [currentView, setCurrentView] = useState('home');

            useEffect(() => { localStorage.setItem('lang', lang); }, [lang]);
            
            useEffect(() => {
                localStorage.setItem('darkMode', darkMode);
                if (darkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [darkMode]);

            // Synchronize with URL hash for clean SPA routing
            useEffect(() => {
                const handleHashRouting = () => {
                    const hash = window.location.hash.replace(/^#\/?/, '');
                    if (['guides', 'about', 'terms', 'policy'].includes(hash)) {
                        setCurrentView(hash);
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    } else if (hash === 'features' || hash === 'contact') {
                        setCurrentView('home');
                        setTimeout(() => {
                            const el = document.getElementById(hash);
                            if (el) el.scrollIntoView({ behavior: 'smooth' });
                        }, 100);
                    } else {
                        setCurrentView('home');
                    }
                };

                handleHashRouting();
                window.addEventListener('hashchange', handleHashRouting);
                return () => window.removeEventListener('hashchange', handleHashRouting);
            }, []);

            const navigateTo = (view, sectionId = null) => {
                if (view === 'home') {
                    if (sectionId) {
                        window.location.hash = `#${sectionId}`;
                    } else {
                        window.location.hash = '#/';
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    }
                } else {
                    window.location.hash = `#/${view}`;
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            };

            return (
                <div className="min-h-screen flex flex-col font-sans selection:bg-brand selection:text-white">
                    <Navbar 
                        lang={lang} 
                        setLang={setLang} 
                        darkMode={darkMode} 
                        setDarkMode={setDarkMode} 
                        currentView={currentView} 
                        navigateTo={navigateTo} 
                    />

                    <main className="flex-1">
                        {currentView === 'home' && (
                            <>
                                <Hero lang={lang} navigateTo={navigateTo} />
                                <Features lang={lang} />
                                <Contact lang={lang} />
                            </>
                        )}
                        {currentView === 'guides' && <Guides lang={lang} navigateTo={navigateTo} />}
                        {currentView === 'about' && <About lang={lang} navigateTo={navigateTo} />}
                        {currentView === 'terms' && <Terms lang={lang} navigateTo={navigateTo} />}
                        {currentView === 'policy' && <Policy lang={lang} navigateTo={navigateTo} />}
                    </main>

                    <Footer lang={lang} navigateTo={navigateTo} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
