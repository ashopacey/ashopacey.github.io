<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AShop - Premium Robux Provider</title>

    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- React 18 & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel Standalone (Compiles JSX in the browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            DEFAULT: '#80A4C6',
                            dark: '#5a82a8',
                            light: '#a6c2d9'
                        },
                        slate: {
                            900: '#0f172a',
                            950: '#020617',
                        }
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'glow': 'glow 2s ease-in-out infinite alternate',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-15px)' },
                        },
                        glow: {
                            'from': { boxShadow: '0 0 10px -5px #80A4C6' },
                            'to': { boxShadow: '0 0 20px 5px rgba(128, 164, 198, 0.4)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #020617;
            color: #ffffff;
            overflow-x: hidden;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a; 
        }
        ::-webkit-scrollbar-thumb {
            background: #80A4C6; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #5a82a8; 
        }
    </style>
</head>
<body class="antialiased selection:bg-brand selection:text-white">
    
    <!-- React Root -->
    <div id="root"></div>

    <!-- React Application Code -->
    <script type="text/babel">
        const { useState, useEffect } = React;

        const Navbar = () => {
            const [isScrolled, setIsScrolled] = useState(false);
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
            const [lang, setLang] = useState('EN');

            useEffect(() => {
                const handleScroll = () => setIsScrolled(window.scrollY > 20);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const toggleLang = () => setLang(lang === 'EN' ? 'MM' : 'EN');

            const navLinks = [
                { name: 'Features', href: '#features' },
                { name: 'Pricelist', href: '#pricelist' },
                { name: 'FAQ', href: '#faq' },
                { name: 'Contact', href: '#contact' }
            ];

            return (
                <nav className={`fixed w-full z-50 transition-all duration-300 ${isScrolled ? 'bg-slate-950/80 backdrop-blur-md py-4 border-b border-slate-800' : 'bg-transparent py-6'}`}>
                    <div className="max-w-7xl mx-auto px-6 flex items-center justify-between">
                        
                        {/* Logo */}
                        <a href="#" className="flex items-center gap-2 group">
                            <div className="w-10 h-10 rounded-xl bg-brand/20 flex items-center justify-center border border-brand/50 group-hover:border-brand transition-colors duration-300">
                                <i className="fa-solid fa-cube text-brand text-xl"></i>
                            </div>
                            <span className="text-2xl font-bold tracking-tight text-white group-hover:text-brand transition-colors duration-300">
                                ASHOP
                            </span>
                        </a>

                        {/* Desktop Navigation Links */}
                        <div className="hidden md:flex items-center gap-8">
                            {navLinks.map((link) => (
                                <a key={link.name} href={link.href} className="text-sm font-medium text-slate-300 hover:text-brand transition-colors duration-300">
                                    {link.name}
                                </a>
                            ))}
                        </div>

                        {/* Actions */}
                        <div className="hidden md:flex items-center gap-6">
                            <button onClick={toggleLang} className="text-sm font-medium text-slate-300 hover:text-brand transition-colors flex items-center gap-2">
                                <i className="fa-solid fa-globe"></i>
                                {lang}
                            </button>
                            <a href="https://t.me/YourBotLink" target="_blank" className="bg-brand text-slate-950 px-6 py-2.5 rounded-full font-semibold hover:bg-white transition-all duration-300 shadow-[0_0_15px_rgba(128,164,198,0.3)] hover:shadow-[0_0_25px_rgba(128,164,198,0.6)] transform hover:-translate-y-0.5">
                                Buy Now
                            </a>
                        </div>

                        {/* Mobile Menu Toggle Button */}
                        <button className="md:hidden text-2xl text-slate-300 hover:text-brand transition-colors" onClick={() => setMobileMenuOpen(!mobileMenuOpen)}>
                            <i className={`fa-solid ${mobileMenuOpen ? 'fa-xmark' : 'fa-bars'}`}></i>
                        </button>
                    </div>

                    {/* Mobile Menu Dropdown */}
                    {mobileMenuOpen && (
                        <div className="md:hidden absolute top-full left-0 w-full bg-slate-900 border-b border-slate-800 py-4 px-6 flex flex-col gap-4 shadow-2xl">
                            {navLinks.map((link) => (
                                <a key={link.name} href={link.href} onClick={() => setMobileMenuOpen(false)} className="text-lg font-medium text-slate-300 hover:text-brand">
                                    {link.name}
                                </a>
                            ))}
                            <div className="h-px w-full bg-slate-800 my-2"></div>
                            <div className="flex items-center justify-between">
                                <button onClick={toggleLang} className="text-lg font-medium text-slate-300 hover:text-brand flex items-center gap-2">
                                    <i className="fa-solid fa-globe"></i> Language: {lang}
                                </button>
                                <a href="https://t.me/YourBotLink" className="bg-brand text-slate-950 px-6 py-2 rounded-lg font-semibold text-center">
                                    Buy Now
                                </a>
                            </div>
                        </div>
                    )}
                </nav>
            );
        };

        const Hero = () => {
            return (
                <section id="home" className="relative min-h-screen flex items-center justify-center pt-24 overflow-hidden">
                    <div className="absolute top-1/4 left-1/4 w-96 h-96 bg-brand/10 rounded-full blur-[120px] pointer-events-none"></div>
                    <div className="absolute bottom-1/4 right-1/4 w-96 h-96 bg-brand/5 rounded-full blur-[100px] pointer-events-none"></div>

                    <div className="max-w-7xl mx-auto px-6 flex flex-col md:flex-row items-center gap-12 relative z-10">
                        <div className="flex-1 text-center md:text-left">
                            <div className="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-slate-800/50 border border-slate-700 mb-6 backdrop-blur-sm">
                                <span className="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
                                <span className="text-xs font-medium text-slate-300 uppercase tracking-wider">Fast Automated Delivery</span>
                            </div>
                            <h1 className="text-5xl md:text-7xl font-extrabold tracking-tight mb-6 leading-tight">
                                Premium <span className="text-transparent bg-clip-text bg-gradient-to-r from-brand to-brand-light">Robux</span> <br/>
                                Delivered Instantly.
                            </h1>
                            <p className="text-lg text-slate-400 mb-10 max-w-xl mx-auto md:mx-0">
                                Upgrade your Roblox experience with AShop. Safe transactions, automated MMQR payment verification, and instant group payouts.
                            </p>
                            <div className="flex flex-col sm:flex-row items-center gap-4 justify-center md:justify-start">
                                <a href="https://t.me/YourBotLink" target="_blank" className="w-full sm:w-auto px-8 py-4 rounded-xl bg-brand text-slate-950 font-bold text-lg hover:bg-white transition-all duration-300 hover:shadow-[0_0_30px_rgba(128,164,198,0.5)] flex items-center justify-center gap-3 transform hover:-translate-y-1">
                                    <i className="fa-brands fa-telegram text-xl"></i>
                                    Open Telegram Bot
                                </a>
                                <a href="#pricelist" className="w-full sm:w-auto px-8 py-4 rounded-xl bg-slate-900 border border-slate-800 text-slate-200 font-bold text-lg hover:border-brand/50 transition-all duration-300 flex items-center justify-center gap-3">
                                    View Pricelist
                                </a>
                            </div>
                        </div>

                        {/* Showcase Feature Card */}
                        <div className="flex-1 flex justify-center">
                            <div className="relative w-full max-w-md p-8 bg-slate-900/60 border border-slate-800 rounded-2xl backdrop-blur-xl animate-float shadow-2xl">
                                <div className="flex items-center justify-between pb-6 border-b border-slate-800">
                                    <div>
                                        <p className="text-xs text-slate-400">Stock Status</p>
                                        <p className="text-xl font-bold text-white">Instant Available</p>
                                    </div>
                                    <div className="w-12 h-12 rounded-xl bg-green-500/10 border border-green-500/30 flex items-center justify-center text-green-400">
                                        <i className="fa-solid fa-bolt text-xl"></i>
                                    </div>
                                </div>
                                <div className="py-6 space-y-4">
                                    <div className="flex justify-between items-center text-sm">
                                        <span className="text-slate-400">Payment Gateway</span>
                                        <span className="font-semibold text-slate-200">KBZPay / WavePay MMQR</span>
                                    </div>
                                    <div className="flex justify-between items-center text-sm">
                                        <span className="text-slate-400">Transfer Method</span>
                                        <span className="font-semibold text-slate-200">Instant Group Payout</span>
                                    </div>
                                    <div className="flex justify-between items-center text-sm">
                                        <span className="text-slate-400">Delivery Speed</span>
                                        <span className="font-semibold text-brand">Under 60 Seconds</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        const Features = () => {
            const items = [
                { icon: 'fa-shield-halved', title: '100% Safe & Clean', desc: 'Sourced strictly through verified developer funds and clean group payouts.' },
                { icon: 'fa-qrcode', title: 'Automated MMQR', desc: 'No waiting for admin confirmation. Scan QR, verify slip, and receive items.' },
                { icon: 'fa-headset', title: '24/7 Support', desc: 'Direct ticket system on Telegram and Discord for instant assistance.' }
            ];

            return (
                <section id="features" className="py-24 max-w-7xl mx-auto px-6">
                    <h2 className="text-3xl md:text-4xl font-bold text-center mb-12">Why Choose <span className="text-brand">AShop</span></h2>
                    <div className="grid md:grid-cols-3 gap-8">
                        {items.map((item, idx) => (
                            <div key={idx} className="p-8 bg-slate-900/40 border border-slate-800 rounded-2xl hover:border-brand/40 transition duration-300">
                                <div className="w-12 h-12 rounded-xl bg-brand/10 border border-brand/30 flex items-center justify-center text-brand text-xl mb-6">
                                    <i className={`fa-solid ${item.icon}`}></i>
                                </div>
                                <h3 className="text-xl font-bold mb-3">{item.title}</h3>
                                <p className="text-slate-400 text-sm leading-relaxed">{item.desc}</p>
                            </div>
                        ))}
                    </div>
                </section>
            );
        };

        const Footer = () => {
            return (
                <footer id="contact" className="border-t border-slate-800/80 py-12 bg-slate-950">
                    <div className="max-w-7xl mx-auto px-6 flex flex-col sm:flex-row justify-between items-center gap-6">
                        <p className="text-slate-500 text-sm">© {new Date().getFullYear()} AShop. All rights reserved.</p>
                        <div className="flex gap-6 text-slate-400">
                            <a href="https://t.me/YourBotLink" target="_blank" className="hover:text-brand transition"><i className="fa-brands fa-telegram text-xl"></i></a>
                            <a href="#" className="hover:text-brand transition"><i className="fa-brands fa-discord text-xl"></i></a>
                        </div>
                    </div>
                </footer>
            );
        };

        const App = () => {
            return (
                <div className="min-h-screen bg-slate-950 flex flex-col justify-between">
                    <Navbar />
                    <Hero />
                    <Features />
                    <Footer />
                </div>
            );
        };

        // React 18 Root Mounting
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
