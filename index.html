<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>

    <title>AShop - Premium Robux Provider</title>

    <!-- Google Fonts: Inter -->

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- React 18 & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],

                    colors: {
                        brand: {
                            DEFAULT: '#38BDF8', 
                            dark: '#0284C7',
                            light: '#7DD3FC',

                        slate: {

                            850: '#131d31',
                            900: '#0b1329',
                            950: '#030712',
                        }
                    },

                        'pulse-glow': 'pulseGlow 2s ease-in-out infinite',

                    keyframes: {
                        pulseGlow: {
                            '0%, 100%': { opacity: '0.6', transform: 'scale(1)' },

    <style>

            overflow-x: hidden;

        ::-webkit-scrollbar-track {

        }

        }

<body class="antialiased selection:bg-brand selection:text-slate-950">
    
    <!-- React Root -->
    <div id="root"></div>

    <!-- React Application Code -->

            }, []);

                                </a>
                            ))}
                        </div>

                        {/* Actions */}
                        <div className="hidden md:flex items-center gap-6">
                            {/* EN / MM Toggle */}
                            <div className="flex items-center gap-1.5 text-sm font-bold bg-slate-900/60 px-3 py-1.5 rounded-full border border-slate-800">

                            <h3 className="text-xl font-bold mb-6 text-white">Direct Support</h3>
                            <div className="p-6 bg-slate-850 border border-brand/30 rounded-xl relative overflow-hidden">
                                {/* Decorative background element */}
